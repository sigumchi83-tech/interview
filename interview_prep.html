<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>면접 준비 워크스페이스</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e9f2;padding:24px 16px}.brand{font-weight:800;font-size:20px;margin:0 8px 24px}.small{font-size:12px;color:#7b8498}.school{padding:12px;border-radius:12px;margin:6px 0;cursor:pointer}.school.active,.school:hover{background:#eef4ff;color:#1457d9}.add{width:100%;border:1px dashed #b7c4dd;background:#fff;padding:11px;border-radius:12px;cursor:pointer;margin-top:12px}.main{padding:34px;max-width:1100px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.hero h1{margin:0;font-size:30px}.progress{background:#e8edf6;border-radius:99px;height:9px;width:220px;overflow:hidden}.bar{height:100%;background:#2d6cdf;width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 2px 8px #17203308}.card.done{background:#f0f8f4;border-color:#d7ebdf}.card:hover{border-color:#9bb8ed}.card h3{margin:0 0 8px;font-size:16px}.card p{margin:0;color:#7b8498;font-size:13px}.editor{display:none;background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px}.back{border:0;background:#eef4ff;color:#1457d9;padding:9px 12px;border-radius:10px;cursor:pointer}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 8px}.tool{border:1px solid #dce3ef;background:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}.rich{width:100%;min-height:280px;border:1px solid #dce3ef;border-radius:12px;padding:14px;font:inherit;outline:none;overflow:auto;margin-bottom:16px;line-height:1.65}.rich:focus{border-color:#8aace8}.rich:empty:before{content:attr(data-placeholder);color:#9aa3b5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;background:#2463d4;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.ghost{background:#f0f3f8;color:#445}.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.imgWrap{position:relative}.imgs img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #ddd;cursor:zoom-in}.imgDel{position:absolute;right:5px;top:5px;border:0;background:#fff;color:#b33;border-radius:99px;width:27px;height:27px;box-shadow:0 1px 6px #0002;cursor:pointer}.lightbox{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:35px}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px}.lightboxClose{position:absolute;right:24px;top:20px;color:#fff;font-size:34px;background:none;border:0;cursor:pointer}.empty{padding:70px;text-align:center;color:#7b8498}.delete{float:right;color:#a44;background:none;border:0;cursor:pointer}@media(max-width:760px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #e5e9f2;padding:14px}.main{padding:20px}.grid{grid-template-columns:1fr}.progress{width:150px}}
.modalBg{display:none;position:fixed;inset:0;background:#17203366;z-index:20;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;width:min(440px,100%);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dce3ef;border-radius:10px;font:inherit}.modalBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}</style></head><body><div class='app'><aside class='side'><div class='brand'>🎓 면접 준비</div><div class='small'>지원 학교</div><div id='schools'></div><button class='add' onclick='addSchool()'>＋ 학교 추가</button><button class='add' onclick='exportPDF()'>📄 현재 학교 PDF</button></aside><main class='main'><div id='home'><div class='hero'><div><div class='small'>INTERVIEW WORKSPACE</div><h1 id='title'>학교를 추가해주세요</h1><div class='small' id='subtitle'>학교별 자료를 한곳에서 정리해요.</div></div><div><div class='small' id='pct'>준비도 0%</div><div class='progress'><div class='bar' id='bar'></div></div></div></div><div id='cards' class='grid'></div></div><section id='editor' class='editor'><button class='back' onclick='closeEditor()'>← 목록으로</button><button class='delete' onclick='clearSection()'>내용 비우기</button><h2 id='sectionTitle'></h2><p class='small' id='hint'></p><div class='toolbar'><button class='tool' onclick="fmt('bold')"><b>B</b></button><button class='tool' onclick="highlight()">🖍 형광펜</button><select class='tool' onchange='fontSize(this.value);this.selectedIndex=0'><option>글씨 크기</option><option value='2'>작게</option><option value='3'>보통</option><option value='4'>크게</option><option value='5'>아주 크게</option></select><button class='tool' onclick="fmt('removeFormat')">서식 지우기</button></div><div id='text' class='rich' contenteditable='true' data-placeholder='여기에 내용을 자유롭게 정리하세요. 입력 내용은 자동 저장됩니다.'></div><div class='row'><label class='btn'>사진 추가<input id='imageInput' type='file' accept='image/*' multiple hidden></label><button class='btn ghost' onclick='markDone()' id='doneBtn'>✓ 준비 완료 표시</button></div><div id='imgs' class='imgs'></div></section></main></div><div id='schoolModal' class='modalBg'><div class='modal'><h2>학교 추가</h2><div class='field'><label>학교 이름</label><input id='schoolName' placeholder='예: 동국대학교'></div><div class='field'><label>지원 학과/전공</label><input id='schoolMajor' placeholder='예: 전자전기공학부'></div><div class='modalBtns'><button class='btn ghost' onclick='closeSchoolModal()'>취소</button><button class='btn' onclick='createSchool()'>추가하기</button></div></div></div><div id='lightbox' class='lightbox' onclick='closeLightbox()'><button class='lightboxClose' onclick='closeLightbox()'>×</button><img id='lightboxImg'></div><script>
const sections=[['인재상','학교·학과가 원하는 인재상과 핵심 역량'],['교육과정','주요 전공과목, 커리큘럼, 트랙'],['학과 특징','다른 대학과 구별되는 학과의 강점과 특징'],['졸업 후 진로','진출 분야, 취업처, 대학원 등'],['교수진 · 연구 분야','관심 교수님과 연구실·전공 분야'],['최근 학과 활동','학과 뉴스, 연구 성과, 행사, 프로젝트'],['면접 관련 자료','면접 방식, 기출 질문, 평가 요소, 후기'],['학생부 연결 포인트','내 활동과 학교·학과를 연결할 근거'],['예상 질문 & 답변','예상 질문, 답변, 핵심 키워드, 꼬리질문'],['추가 공부','면접 전에 보완해야 할 개념과 자료']];
let memoryStore=null;
function loadDB(){try{let raw=localStorage.getItem('interviewDB');return raw?JSON.parse(raw):{schools:[],active:null}}catch(e){return {schools:[],active:null}}}
let db=loadDB(), current=null;
function save(){try{localStorage.setItem('interviewDB',JSON.stringify(db))}catch(e){memoryStore=JSON.stringify(db)}}function active(){return db.schools.find(x=>x.id===db.active)}
function render(){let s=document.getElementById('schools');s.innerHTML='';db.schools.forEach(x=>{let d=document.createElement('div');d.className='school '+(x.id===db.active?'active':'');d.innerHTML='<b>'+esc(x.name)+'</b><div class="small">'+esc(x.major||'학과 미입력')+'</div>';d.onclick=()=>{db.active=x.id;save();render()};s.appendChild(d)});let a=active();document.getElementById('title').textContent=a?a.name:'학교를 추가해주세요';document.getElementById('subtitle').textContent=a?(a.major||'학과를 입력하지 않았어요'):'학교별 자료를 한곳에서 정리해요.';let c=document.getElementById('cards');c.innerHTML='';if(!a){c.innerHTML='<div class="empty">왼쪽의 ‘학교 추가’를 눌러 시작해보세요.</div>';return}sections.forEach(([n,h])=>{let k=n, val=a.data?.[k]?.text||'',done=a.data?.[k]?.done;let el=document.createElement('div');el.className='card'+(done?' done':'');el.innerHTML='<h3>'+(done?'✅ ':'')+n+'</h3><p>'+(val?esc(strip(val).slice(0,65))+(strip(val).length>65?'…':''):h)+'</p>';el.onclick=()=>openEditor(k,h);c.appendChild(el)});let done=sections.filter(([n])=>a.data?.[n]?.done).length,p=Math.round(done/sections.length*100);document.getElementById('pct').textContent='준비도 '+p+'%';document.getElementById('bar').style.width=p+'%'}
function addSchool(){document.getElementById('schoolModal').style.display='flex';setTimeout(()=>document.getElementById('schoolName').focus(),50)}function closeSchoolModal(){document.getElementById('schoolModal').style.display='none';document.getElementById('schoolName').value='';document.getElementById('schoolMajor').value=''}function createSchool(){let name=document.getElementById('schoolName').value.trim();if(!name){document.getElementById('schoolName').focus();return}let major=document.getElementById('schoolMajor').value.trim();let x={id:Date.now(),name,major,data:{}};db.schools.push(x);db.active=x.id;save();closeSchoolModal();render()}document.getElementById('schoolMajor').addEventListener('keydown',e=>{if(e.key==='Enter')createSchool()});document.getElementById('schoolName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('schoolMajor').focus()});
function openEditor(k,h){current=k;let a=active();a.data=a.data||{};a.data[k]=a.data[k]||{text:'',images:[],done:false};document.getElementById('home').style.display='none';document.getElementById('editor').style.display='block';document.getElementById('sectionTitle').textContent=k;document.getElementById('hint').textContent=h;document.getElementById('text').innerHTML=a.data[k].text||'';document.getElementById('doneBtn').textContent=a.data[k].done?'↩ 준비 완료 해제':'✓ 준비 완료 표시';renderImgs()}
function closeEditor(){document.getElementById('editor').style.display='none';document.getElementById('home').style.display='block';render()}
document.getElementById('text').addEventListener('input',e=>{let a=active();a.data[current].text=e.target.innerHTML;save()});function fmt(c){document.execCommand(c,false,null);document.getElementById('text').focus()}function highlight(){document.execCommand('hiliteColor',false,'#fff3a6');document.getElementById('text').focus()}function fontSize(v){if(v)document.execCommand('fontSize',false,v);document.getElementById('text').focus()}function markDone(){let a=active();a.data[current].done=!a.data[current].done;save();openEditor(current,sections.find(x=>x[0]===current)[1])}function clearSection(){if(!confirm('이 항목의 글과 사진을 모두 비울까?'))return;active().data[current]={text:'',images:[],done:false};save();openEditor(current,sections.find(x=>x[0]===current)[1])}
document.getElementById('imageInput').addEventListener('change',e=>{[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{active().data[current].images.push(r.result);save();renderImgs()};r.readAsDataURL(f)});e.target.value=''})
function renderImgs(){let box=document.getElementById('imgs'),arr=active().data[current].images||[];box.innerHTML='';arr.forEach((src,i)=>{let w=document.createElement('div');w.className='imgWrap';let im=document.createElement('img');im.src=src;im.title='클릭해서 크게 보기';im.onclick=()=>openLightbox(src);let del=document.createElement('button');del.className='imgDel';del.textContent='×';del.title='사진 삭제';del.onclick=(e)=>{e.stopPropagation();if(confirm('이 사진을 삭제할까?')){arr.splice(i,1);save();renderImgs()}};w.append(im,del);box.appendChild(w)})}function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').style.display='flex'}function closeLightbox(){document.getElementById('lightbox').style.display='none'}function strip(html){let d=document.createElement('div');d.innerHTML=html||'';return d.textContent||''}function exportPDF(){let a=active();if(!a)return alert('먼저 학교를 선택해주세요.');let w=window.open('','_blank');let body=sections.map(([n])=>{let d=a.data?.[n]||{};let imgs=(d.images||[]).map(x=>`<img src="${x}">`).join('');return `<section><h2>${esc(n)} ${d.done?'✓':''}</h2><div>${d.text||'<span class=muted>작성된 내용 없음</span>'}</div><div class=imgs>${imgs}</div></section>`}).join('');w.document.write(`<!doctype html><html lang=ko><head><meta charset=utf-8><title>${esc(a.name)} 면접 준비</title><style>@page{size:A4;margin:16mm}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#172033;line-height:1.6}h1{font-size:25px;margin-bottom:2px}.sub{color:#667085;margin-bottom:24px}section{break-inside:avoid;border-top:1px solid #dde3ed;padding:14px 0}h2{font-size:17px;margin:0 0 8px}.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.imgs img{max-width:180px;max-height:140px;object-fit:contain}.muted{color:#999}</style></head><body><h1>${esc(a.name)}</h1><div class=sub>${esc(a.major||'')} · 면접 준비 자료</div>${body}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}render();
</script></body></html>
