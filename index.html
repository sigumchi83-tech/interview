<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>면접 준비 워크스페이스</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e9f2;padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:850;font-size:20px;margin:2px 8px 22px}.small{font-size:12px;color:#7b8498}.school{padding:11px 12px;border-radius:12px;margin:5px 0;cursor:pointer;position:relative}.school.active,.school:hover{background:#eef4ff;color:#1457d9}.schoolBtns{position:absolute;right:8px;top:8px;display:flex;gap:2px}.mini{border:0;background:transparent;color:#98a2b3;cursor:pointer;padding:3px}.add{width:100%;border:1px dashed #b7c4dd;background:#fff;padding:10px;border-radius:12px;cursor:pointer;margin-top:9px}.nav{display:grid;gap:6px;margin:18px 0}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:#465166}.nav button.active,.nav button:hover{background:#eef4ff;color:#1457d9;font-weight:700}.main{padding:30px;max-width:1180px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.hero h1{margin:2px 0;font-size:29px}.progress{background:#e8edf6;border-radius:99px;height:9px;width:220px;overflow:hidden}.bar{height:100%;background:#2d6cdf;width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:17px;cursor:pointer;box-shadow:0 2px 8px #17203308}.card.done{background:#eef9f4;border-color:#d3eade}.card:hover{border-color:#9bb8ed}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:#7b8498;font-size:13px}.panel,.editor{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px}.editor{display:none}.back{border:0;background:#eef4ff;color:#1457d9;padding:9px 12px;border-radius:10px;cursor:pointer}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 8px}.tool{border:1px solid #dce3ef;background:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}.rich{width:100%;min-height:260px;border:1px solid #dce3ef;border-radius:12px;padding:14px;outline:none;overflow:auto;margin-bottom:12px;line-height:1.65}.rich:focus{border-color:#8aace8}.rich:empty:before{content:attr(data-placeholder);color:#9aa3b5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;background:#2463d4;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit}.ghost{background:#f0f3f8;color:#445}.danger{background:#fff1f1;color:#b42318}.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.imgWrap{position:relative}.imgs img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #ddd;cursor:zoom-in}.imgDel{position:absolute;right:5px;top:5px;border:0;background:#fff;color:#b33;border-radius:99px;width:27px;height:27px;box-shadow:0 1px 6px #0002;cursor:pointer}.lightbox{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:35px}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px}.lightboxClose{position:absolute;right:24px;top:20px;color:#fff;font-size:34px;background:none;border:0;cursor:pointer}.empty{padding:60px;text-align:center;color:#7b8498}.delete{float:right;color:#a44;background:none;border:0;cursor:pointer}.modalBg{display:none;position:fixed;inset:0;background:#17203366;z-index:20;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #dce3ef;border-radius:10px;font:inherit}.field textarea{min-height:120px;resize:vertical}#qAnswer{min-height:260px;line-height:1.65}#fAnswer{min-height:200px;line-height:1.65}.followList{margin-top:12px;display:grid;gap:8px}.followItem{padding:11px 12px;background:#f7f9fc;border-radius:10px;border-left:3px solid #9bb8ed}.followQ{font-weight:700}.followA{white-space:pre-wrap;margin-top:7px;color:#465166}.practiceFollow{font-size:14px;font-weight:800;color:#2463d4;margin-bottom:-10px}.modalBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.topline h2{margin:0}.search{padding:10px 12px;border:1px solid #dce3ef;border-radius:10px;min-width:220px}.qcard,.activity,.daybox{border:1px solid #e3e8f1;border-radius:14px;padding:15px;margin:10px 0;background:#fff}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qtitle{font-weight:750;line-height:1.45}.star{border:0;background:transparent;font-size:20px;cursor:pointer}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;margin-right:5px}.red{background:#fff0ef;color:#b42318}.yellow{background:#fff8dc;color:#8a6500}.green{background:#eaf8f0;color:#16794b}.answer{margin-top:10px;padding:11px;background:#f7f9fc;border-radius:10px;white-space:pre-wrap}.chips{margin-top:8px}.chip{display:inline-block;background:#eef4ff;color:#315da8;border-radius:99px;padding:4px 8px;font-size:11px;margin:2px}.practice{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.practiceQ{font-size:25px;font-weight:800;max-width:760px;line-height:1.5;margin:22px}.practiceA{max-width:760px;text-align:left;width:100%;padding:18px;background:#f7f9fc;border-radius:14px;white-space:pre-wrap}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.stat{background:#f7f9fc;border-radius:12px;padding:9px 12px;font-size:12px}.source{margin-top:12px;padding-top:12px;border-top:1px solid #edf0f5}.source input{width:100%;border:1px solid #dce3ef;border-radius:9px;padding:9px}.daygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.daybox label{display:block;font-size:12px;font-weight:700;color:#667085;margin-bottom:5px}.daybox input,.daybox textarea{width:100%;border:0;outline:0;font:inherit;background:transparent}.daybox textarea{min-height:70px}.note{font-size:12px;color:#667085;margin-top:8px}.schoolTags{display:flex;gap:7px;flex-wrap:wrap;padding:10px;border:1px solid #dce3ef;border-radius:10px}.schoolTag{font-size:12px;background:#f7f9fc;padding:7px 9px;border-radius:9px}.schoolTag input{width:auto;margin-right:5px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid #e5e9f2}.main{padding:18px}.grid,.daygrid{grid-template-columns:1fr}.progress{width:145px}.hero{align-items:flex-start}.search{min-width:0;width:100%}.topline{align-items:stretch;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🎓 면접 준비</div><div class="small">지원 학교</div><div id="schools"></div><button class="add" onclick="addSchool()">＋ 학교 추가</button><div class="nav"><button id="navResearch" onclick="showView('research')">📚 학교 조사</button><button id="navQuestions" onclick="showView('questions')">💬 예상 질문</button><button id="navActivities" onclick="showView('activities')">🔗 학생부 연결</button><button id="navPractice" onclick="showView('practice')">🎤 실전 면접</button><button id="navDay" onclick="showView('day')">📌 면접 당일</button></div><button class="add" onclick="exportPDF()">📄 현재 학교 PDF</button></aside><main class="main"><div class="hero"><div><div class="small">INTERVIEW WORKSPACE</div><h1 id="title">학교를 추가해주세요</h1><div class="small" id="subtitle">학교별 자료를 한곳에서 정리해요.</div></div><div><div class="small" id="pct">준비도 0%</div><div class="progress"><div class="bar" id="bar"></div></div></div></div><div id="view"></div><section id="editor" class="editor"><button class="back" onclick="closeEditor()">← 목록으로</button><button class="delete" onclick="clearSection()">내용 비우기</button><h2 id="sectionTitle"></h2><p class="small" id="hint"></p><div class="toolbar"><button class="tool" onclick="fmt('bold')"><b>B</b></button><button class="tool" onclick="highlight()">🖍 형광펜</button><select class="tool" onchange="fontSize(this.value);this.selectedIndex=0"><option>글씨 크기</option><option value="2">작게</option><option value="3">보통</option><option value="4">크게</option><option value="5">아주 크게</option></select><button class="tool" onclick="fmt('removeFormat')">서식 지우기</button></div><div id="text" class="rich" contenteditable="true" data-placeholder="여기에 내용을 자유롭게 정리하세요. 자동 저장됩니다."></div><div class="row"><label class="btn">사진 추가<input id="imageInput" type="file" accept="image/*" multiple hidden></label><button class="btn ghost" onclick="markDone()" id="doneBtn">✓ 준비 완료 표시</button></div><div id="imgs" class="imgs"></div><div class="source"><div class="small">출처 URL (선택)</div><input id="sourceUrl" placeholder="https://..." oninput="saveSource(this.value)"></div></section></main></div>
<div id="schoolModal" class="modalBg"><div class="modal"><h2>학교 추가</h2><div class="field"><label>학교 이름</label><input id="schoolName" placeholder="예: 동국대학교"></div><div class="field"><label>지원 학과/전공</label><input id="schoolMajor" placeholder="예: 전자전기공학부"></div><div class="modalBtns"><button class="btn ghost" onclick="closeModal('schoolModal')">취소</button><button class="btn" onclick="createSchool()">추가하기</button></div></div></div>
<div id="qModal" class="modalBg"><div class="modal"><h2 id="qModalTitle">질문 추가</h2><div class="field"><label>질문</label><textarea id="qText"></textarea></div><div class="field"><label>내 답변</label><textarea id="qAnswer"></textarea></div><div class="field"><label>핵심 키워드 (쉼표로 구분)</label><input id="qKeywords" placeholder="비트레이트, 문제해결, 방송부"></div><div class="field"><label>연결 학생부 활동</label><select id="qActivity"></select></div><div class="field"><label>준비도</label><select id="qStatus"><option value="red">🔴 미준비</option><option value="yellow">🟡 보완 필요</option><option value="green">🟢 답변 가능</option></select></div><div class="field"><label>관련 학교 (선택하지 않으면 전체 공통)</label><div id="qSchoolTags" class="schoolTags"></div></div><div class="field"><label><input id="qStar" type="checkbox" style="width:auto"> ⭐ 중요 질문</label></div><div class="modalBtns"><button class="btn ghost" onclick="closeModal('qModal')">취소</button><button class="btn" onclick="saveQuestion()">저장</button></div></div></div>
<div id="aModal" class="modalBg"><div class="modal"><h2 id="aModalTitle">학생부 활동 추가</h2><div class="field"><label>활동명</label><input id="aTitle" placeholder="예: 방송부 라이브 스트리밍"></div><div class="field"><label>활동 내용 / 배운 점</label><textarea id="aBody"></textarea></div><div class="field"><label>핵심 키워드</label><input id="aKeywords" placeholder="네트워크, 비트레이트, 문제 해결"></div><div class="field"><label>이 학교와 연결 포인트</label><textarea id="aLink" placeholder="교육과정·학과 특징·지원동기와 어떻게 연결할지"></textarea></div><div class="modalBtns"><button class="btn ghost" onclick="closeModal('aModal')">취소</button><button class="btn" onclick="saveActivity()">저장</button></div></div></div>
<div id="fModal" class="modalBg"><div class="modal"><h2 id="fModalTitle">꼬리질문 추가</h2><div class="field"><label>꼬리질문</label><textarea id="fText" placeholder="예: 그렇다면 비트레이트를 낮추면 화질에는 어떤 영향이 있나요?"></textarea></div><div class="field"><label>내 답변</label><textarea id="fAnswer" placeholder="꼬리질문에 대한 답변을 적어두세요."></textarea></div><div class="modalBtns"><button class="btn ghost" onclick="closeModal('fModal')">취소</button><button class="btn" onclick="saveFollowup()">저장</button></div></div></div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()"><button class="lightboxClose">×</button><img id="lightboxImg"></div><script>
const sections=[['인재상','학교·학과가 원하는 인재상과 핵심 역량'],['교육과정','주요 전공과목, 커리큘럼, 트랙'],['학과 특징','다른 대학과 구별되는 학과의 강점과 특징'],['졸업 후 진로','진출 분야, 취업처, 대학원 등'],['교수진 · 연구 분야','관심 교수님과 연구실·전공 분야'],['최근 학과 활동','학과 뉴스, 연구 성과, 행사, 프로젝트'],['면접 관련 자료','면접 방식, 기출 질문, 평가 요소, 후기'],['학생부 연결 포인트','내 활동과 학교·학과를 연결할 근거'],['추가 공부','면접 전에 보완해야 할 개념과 자료']];
function loadDB(){try{let x=JSON.parse(localStorage.getItem('interviewDB')||'null');return x||{schools:[],active:null}}catch(e){return {schools:[],active:null}}}let db=loadDB(),current=null,currentView='research',editQ=null,editA=null,practicePool=[],practiceIndex=0,practiceFollowIndex=-1,showAns=false;db.schools=(db.schools||[]).map(s=>{s.data=s.data||{};s.questions=s.questions||[];s.activities=s.activities||[];s.day=s.day||{};return s});if(!db.questions){let seen=new Set(),m=[];(db.commonQuestions||[]).forEach(q=>{if(!seen.has(q.id)){q.schoolIds=[];m.push(q);seen.add(q.id)}});db.schools.forEach(sc=>(sc.questions||[]).forEach(q=>{if(!seen.has(q.id)){q.schoolIds=[sc.id];m.push(q);seen.add(q.id)}}));db.questions=m}db.questions=db.questions||[];db.questions.forEach(q=>q.followups=q.followups||[]);db.commonQuestions=[];db.schools.forEach(s=>s.questions=[]);
function save(){try{localStorage.setItem('interviewDB',JSON.stringify(db))}catch(e){alert('저장 공간이 부족해요. 사진을 조금 줄여주세요.')}}function active(){return db.schools.find(x=>x.id===db.active)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function strip(h){let d=document.createElement('div');d.innerHTML=h||'';return d.textContent||''}function closeModal(id){document.getElementById(id).style.display='none'}
function renderShell(){let box=document.getElementById('schools');box.innerHTML='';db.schools.forEach((x,i)=>{let d=document.createElement('div');d.className='school '+(x.id===db.active?'active':'');d.innerHTML=`<b>${esc(x.name)}</b><div class="small">${esc(x.major||'학과 미입력')}</div><div class="schoolBtns"><button class="mini" onclick="event.stopPropagation();moveSchool(${i},-1)">↑</button><button class="mini" onclick="event.stopPropagation();moveSchool(${i},1)">↓</button></div>`;d.onclick=()=>{db.active=x.id;save();render()};box.appendChild(d)});let a=active();document.getElementById('title').textContent=a?a.name:'학교를 추가해주세요';document.getElementById('subtitle').textContent=a?(a.major||'학과를 입력하지 않았어요'):'학교별 자료를 한곳에서 정리해요.';let done=a?sections.filter(([n])=>a.data?.[n]?.done).length:0,p=a?Math.round(done/sections.length*100):0;document.getElementById('pct').textContent='준비도 '+p+'%';document.getElementById('bar').style.width=p+'%';['Research','Questions','Activities','Practice','Day'].forEach(x=>document.getElementById('nav'+x)?.classList.toggle('active',currentView===x.toLowerCase()))}
function render(){renderShell();document.getElementById('editor').style.display='none';let v=document.getElementById('view');v.style.display='block';if(!active()){v.innerHTML='<div class="empty">왼쪽의 ‘학교 추가’를 눌러 시작해보세요.</div>';return}({research:renderResearch,questions:renderQuestions,activities:renderActivities,practice:renderPractice,day:renderDay}[currentView]||renderResearch)()}function showView(v){currentView=v;render()}
function renderResearch(){let a=active(),v=document.getElementById('view');v.innerHTML='<div class="topline"><h2>📚 학교 조사</h2><input id="sectionSearch" class="search" placeholder="항목 내용 검색" oninput="filterSections(this.value)"></div><div id="cards" class="grid"></div>';let c=document.getElementById('cards');sections.forEach(([n,h])=>{let d=a.data?.[n]||{},val=d.text||d.html||'';let el=document.createElement('div');el.className='card'+(d.done?' done':'');el.dataset.search=(n+' '+strip(val)).toLowerCase();el.innerHTML=`<h3>${d.done?'✅ ':''}${esc(n)}</h3><p>${val?esc(strip(val).slice(0,70))+(strip(val).length>70?'…':''):esc(h)}</p>`;el.onclick=()=>openEditor(n,h);c.appendChild(el)})}function filterSections(q){q=q.toLowerCase();document.querySelectorAll('#cards .card').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')}
function addSchool(){document.getElementById('schoolModal').style.display='flex';setTimeout(()=>schoolName.focus(),50)}function createSchool(){let n=schoolName.value.trim();if(!n)return schoolName.focus();let s={id:Date.now(),name:n,major:schoolMajor.value.trim(),data:{},questions:[],activities:[],day:{}};db.schools.push(s);db.active=s.id;save();schoolName.value='';schoolMajor.value='';closeModal('schoolModal');render()}function moveSchool(i,d){let j=i+d;if(j<0||j>=db.schools.length)return;[db.schools[i],db.schools[j]]=[db.schools[j],db.schools[i]];save();render()}
function openEditor(k,h){current=k;let a=active();a.data[k]=a.data[k]||{text:'',images:[],done:false,source:''};let d=a.data[k];document.getElementById('view').style.display='none';editor.style.display='block';sectionTitle.textContent=k;hint.textContent=h;text.innerHTML=d.text||d.html||'';sourceUrl.value=d.source||'';doneBtn.textContent=d.done?'↩ 준비 완료 해제':'✓ 준비 완료 표시';renderImgs()}function closeEditor(){editor.style.display='none';document.getElementById('view').style.display='block';render()}text.addEventListener('input',e=>{active().data[current].text=e.target.innerHTML;save()});function saveSource(v){active().data[current].source=v;save()}function fmt(c){document.execCommand(c,false,null);text.focus()}function highlight(){document.execCommand('hiliteColor',false,'#fff3a6');text.focus()}function fontSize(v){if(v)document.execCommand('fontSize',false,v);text.focus()}function markDone(){active().data[current].done=!active().data[current].done;save();doneBtn.textContent=active().data[current].done?'↩ 준비 완료 해제':'✓ 준비 완료 표시'}function clearSection(){if(confirm('이 항목의 글과 사진을 모두 비울까?')){active().data[current]={text:'',images:[],done:false,source:''};save();openEditor(current,sections.find(x=>x[0]===current)[1])}}
imageInput.addEventListener('change',async e=>{for(const f of [...e.target.files]){let src=await compressImage(f);active().data[current].images=(active().data[current].images||[]);active().data[current].images.push(src);save()}renderImgs();e.target.value='' });function compressImage(f){return new Promise(res=>{let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}function renderImgs(){let b=imgs,arr=active().data[current].images||[];b.innerHTML='';arr.forEach((src,i)=>{let w=document.createElement('div');w.className='imgWrap';w.innerHTML=`<img src="${src}"><button class="imgDel">×</button>`;w.querySelector('img').onclick=()=>openLightbox(src);w.querySelector('button').onclick=e=>{e.stopPropagation();if(confirm('이 사진을 삭제할까?')){arr.splice(i,1);save();renderImgs()}};b.appendChild(w)})}function openLightbox(src){lightboxImg.src=src;lightbox.style.display='flex'}function closeLightbox(){lightbox.style.display='none'}
function allQuestions(){return db.questions||[]}function schoolNames(q){let ids=q.schoolIds||[];if(!ids.length)return '전체 공통';return ids.map(id=>db.schools.find(s=>String(s.id)===String(id))?.name).filter(Boolean).join(' · ')||'전체 공통'}function renderQuestions(){let qs=allQuestions();let counts={red:0,yellow:0,green:0};qs.forEach(q=>counts[q.status||'red']++);view.innerHTML=`<div class="topline"><div><h2>💬 공통 예상 질문은행</h2><div class="small">질문은 학교와 관계없이 한곳에서 관리하고, 필요한 질문에만 관련 학교 태그를 붙여요.</div></div><div class="row"><input id="qSearch" class="search" placeholder="질문·답변 검색" oninput="renderQuestionList()"><button class="btn" onclick="openQuestion()">＋ 질문 추가</button></div></div><div class="stats"><span class="stat">전체 ${qs.length}</span><span class="stat">🔴 ${counts.red}</span><span class="stat">🟡 ${counts.yellow}</span><span class="stat">🟢 ${counts.green}</span><label class="stat"><input id="onlyStar" type="checkbox" onchange="renderQuestionList()"> ⭐ 중요만</label><label class="stat"><input id="weakOnly" type="checkbox" onchange="renderQuestionList()"> 🔴🟡만</label></div><div id="qList"></div>`;renderQuestionList()}function renderQuestionList(){let b=document.getElementById('qList');if(!b)return;let term=(document.getElementById('qSearch')?.value||'').toLowerCase(),star=document.getElementById('onlyStar')?.checked,weak=document.getElementById('weakOnly')?.checked;let qs=allQuestions().filter(q=>(!term||(q.text+' '+q.answer+' '+q.keywords+' '+schoolNames(q)).toLowerCase().includes(term))&&(!star||q.star)&&(!weak||q.status!=='green'));if(!qs.length){b.innerHTML='<div class="empty">조건에 맞는 질문이 없어요.</div>';return}b.innerHTML=qs.map(q=>`<div class="qcard"><div class="qhead"><div><span class="badge ${q.status||'red'}">${q.status==='green'?'🟢 답변 가능':q.status==='yellow'?'🟡 보완 필요':'🔴 미준비'}</span><span class="badge">${esc(schoolNames(q))}</span><div class="qtitle">${q.star?'⭐ ':''}${esc(q.text)}</div></div><div class="row"><button class="mini" onclick="toggleStar('${q.id}')">⭐</button><button class="mini" onclick="editQuestion('${q.id}')">수정</button><button class="mini" onclick="deleteQuestion('${q.id}')">삭제</button></div></div>${q.answer?`<div class="answer">${esc(q.answer)}</div>`:''}${q.keywords?`<div class="chips">${q.keywords.split(',').filter(Boolean).map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div>`:''}${q.activity?`<div class="note">🔗 ${esc(q.activity)}</div>`:''}${(q.followups||[]).length?`<div class="followList">${q.followups.map((f,i)=>`<div class="followItem"><div class="qhead"><div><div class="followQ">↳ 꼬리질문 ${i+1}. ${esc(f.text)}</div>${f.answer?`<div class="followA">${esc(f.answer)}</div>`:''}</div><div><button class="mini" onclick="editFollowup('${q.id}','${f.id}')">수정</button><button class="mini" onclick="deleteFollowup('${q.id}','${f.id}')">삭제</button></div></div></div>`).join('')}</div>`:''}<div style="margin-top:10px"><button class="tool" onclick="openFollowup('${q.id}')">＋ 꼬리질문 추가</button></div></div>`).join('')}function openQuestion(q=null){editQ=q?.id||null;qModalTitle.textContent=q?'질문 수정':'질문 추가';qText.value=q?.text||'';qAnswer.value=q?.answer||'';qKeywords.value=q?.keywords||'';qStatus.value=q?.status||'red';qStar.checked=!!q?.star;let acts=[...new Set(db.schools.flatMap(s=>(s.activities||[]).map(x=>x.title)))];qActivity.innerHTML='<option value="">연결 안 함</option>'+acts.map(x=>`<option>${esc(x)}</option>`).join('');qActivity.value=q?.activity||'';qSchoolTags.innerHTML=db.schools.length?db.schools.map(s=>`<label class="schoolTag"><input type="checkbox" value="${s.id}" ${(q?.schoolIds||[]).map(String).includes(String(s.id))?'checked':''}>${esc(s.name)}</label>`).join(''):'<span class="small">등록된 학교가 없어요. 질문은 전체 공통으로 저장됩니다.</span>';qModal.style.display='flex'}function saveQuestion(){let t=qText.value.trim();if(!t)return qText.focus();let schoolIds=[...qSchoolTags.querySelectorAll('input:checked')].map(x=>x.value);let existing=editQ?db.questions.find(x=>x.id===editQ):null;let obj={id:editQ||String(Date.now()),text:t,answer:qAnswer.value.trim(),keywords:qKeywords.value.trim(),activity:qActivity.value,status:qStatus.value,star:qStar.checked,schoolIds,followups:existing?.followups||[]};if(editQ){let i=db.questions.findIndex(x=>x.id===editQ);if(i>=0)db.questions[i]=obj}else db.questions.push(obj);save();closeModal('qModal');renderQuestions()}function editQuestion(id){openQuestion(db.questions.find(x=>x.id===id))}function deleteQuestion(id){if(!confirm('이 질문을 삭제할까?'))return;db.questions=db.questions.filter(x=>x.id!==id);save();renderQuestions()}function toggleStar(id){let q=db.questions.find(x=>x.id===id);if(q)q.star=!q.star;save();renderQuestions()}
let followParent=null,editF=null;function openFollowup(qid,fid=null){followParent=qid;editF=fid;let q=db.questions.find(x=>x.id===qid),f=(q?.followups||[]).find(x=>x.id===fid);fModalTitle.textContent=f?'꼬리질문 수정':'꼬리질문 추가';fText.value=f?.text||'';fAnswer.value=f?.answer||'';fModal.style.display='flex';setTimeout(()=>fText.focus(),50)}function saveFollowup(){let t=fText.value.trim();if(!t)return fText.focus();let q=db.questions.find(x=>x.id===followParent);if(!q)return;q.followups=q.followups||[];let obj={id:editF||String(Date.now()),text:t,answer:fAnswer.value.trim()};if(editF){let i=q.followups.findIndex(x=>x.id===editF);if(i>=0)q.followups[i]=obj}else q.followups.push(obj);save();closeModal('fModal');renderQuestions()}function editFollowup(qid,fid){openFollowup(qid,fid)}function deleteFollowup(qid,fid){if(!confirm('이 꼬리질문을 삭제할까?'))return;let q=db.questions.find(x=>x.id===qid);if(q)q.followups=(q.followups||[]).filter(x=>x.id!==fid);save();renderQuestions()}
function renderActivities(){let a=active();view.innerHTML=`<div class="topline"><div><h2>🔗 학생부 연결</h2><div class="small">학생부 활동을 등록하고 이 학교와의 연결 포인트를 정리해요.</div></div><button class="btn" onclick="openActivity()">＋ 활동 추가</button></div><div id="aList">${a.activities.length?a.activities.map(x=>`<div class="activity"><div class="qhead"><div class="qtitle">${esc(x.title)}</div><div><button class="mini" onclick="editActivity('${x.id}')">수정</button><button class="mini" onclick="deleteActivity('${x.id}')">삭제</button></div></div>${x.body?`<div class="answer">${esc(x.body)}</div>`:''}${x.keywords?`<div class="chips">${x.keywords.split(',').map(k=>`<span class="chip">${esc(k.trim())}</span>`).join('')}</div>`:''}${x.link?`<div class="note"><b>이 학교 연결:</b> ${esc(x.link)}</div>`:''}</div>`).join(''):'<div class="empty">학생부 핵심 활동을 추가해보세요.</div>'}</div>`}function openActivity(x=null){editA=x?.id||null;aModalTitle.textContent=x?'활동 수정':'학생부 활동 추가';aTitle.value=x?.title||'';aBody.value=x?.body||'';aKeywords.value=x?.keywords||'';aLink.value=x?.link||'';aModal.style.display='flex'}function saveActivity(){if(!aTitle.value.trim())return aTitle.focus();let x={id:editA||String(Date.now()),title:aTitle.value.trim(),body:aBody.value.trim(),keywords:aKeywords.value.trim(),link:aLink.value.trim()},arr=active().activities;if(editA){let i=arr.findIndex(y=>y.id===editA);arr[i]=x}else arr.push(x);save();closeModal('aModal');renderActivities()}function editActivity(id){openActivity(active().activities.find(x=>x.id===id))}function deleteActivity(id){if(!confirm('이 활동을 삭제할까?'))return;active().activities=active().activities.filter(x=>x.id!==id);save();renderActivities()}
function practiceQuestions(){let f=document.getElementById('practiceFilter')?.value||'all';return allQuestions().filter(q=>f==='all'||!(q.schoolIds||[]).length||(q.schoolIds||[]).map(String).includes(String(f)))}function renderPractice(){let filter=document.getElementById('practiceFilter')?.value||'all';practicePool=allQuestions().filter(q=>filter==='all'||!(q.schoolIds||[]).length||(q.schoolIds||[]).map(String).includes(String(filter)));if(!practicePool.length){view.innerHTML=`<div class="panel"><div class="row"><select id="practiceFilter" class="tool" onchange="practiceIndex=0;practiceFollowIndex=-1;showAns=false;renderPractice()"><option value="all">전체 질문</option>${db.schools.map(s=>`<option value="${s.id}" ${String(filter)===String(s.id)?'selected':''}>${esc(s.name)} 관련 질문</option>`).join('')}</select></div><div class="empty">이 조건에 맞는 예상 질문이 없어요.</div></div>`;return}if(practiceIndex>=practicePool.length)practiceIndex=0;let q=practicePool[practiceIndex],f=practiceFollowIndex>=0?(q.followups||[])[practiceFollowIndex]:null,currentText=f?.text||q.text,currentAnswer=f?.answer||q.answer;view.innerHTML=`<div class="panel practice"><div class="row"><select id="practiceFilter" class="tool" onchange="practiceIndex=0;practiceFollowIndex=-1;showAns=false;renderPractice()"><option value="all">전체 질문</option>${db.schools.map(s=>`<option value="${s.id}" ${String(filter)===String(s.id)?'selected':''}>${esc(s.name)} 관련 질문</option>`).join('')}</select></div><div class="small">실전 면접 · ${practiceIndex+1}/${practicePool.length} · ${esc(schoolNames(q))}</div>${f?`<div class="practiceFollow">↳ 꼬리질문 ${practiceFollowIndex+1}/${(q.followups||[]).length}</div>`:''}<div class="practiceQ">${esc(currentText)}</div>${showAns?`<div class="practiceA"><b>${f?'꼬리질문 답변':'내 답변'}</b><br>${esc(currentAnswer||'작성한 답변이 없어요.')}${!f&&q.keywords?`<div class="chips">${q.keywords.split(',').map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div>`:''}</div>`:''}<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="showAns=!showAns;renderPractice()">${showAns?'답변 숨기기':'내 답변 보기'}</button><button class="btn" onclick="nextPractice()">${practiceFollowIndex<(q.followups||[]).length-1?'다음 꼬리질문 →':'다음 질문 →'}</button><button class="btn ghost" onclick="shufflePractice()">🔀 랜덤 섞기</button></div>${showAns&&!f?`<div class="row" style="margin-top:14px"><span class="small">말해본 뒤 준비도 기록:</span><button class="tool" onclick="setPracticeStatus('red')">🔴</button><button class="tool" onclick="setPracticeStatus('yellow')">🟡</button><button class="tool" onclick="setPracticeStatus('green')">🟢</button></div>`:''}</div>`}function nextPractice(){let q=practicePool[practiceIndex],fs=q.followups||[];if(practiceFollowIndex<fs.length-1){practiceFollowIndex++;showAns=false;renderPractice();return}practiceIndex=(practiceIndex+1)%practicePool.length;practiceFollowIndex=-1;showAns=false;renderPractice()}function shufflePractice(){practicePool=practicePool.sort(()=>Math.random()-.5);practiceIndex=0;practiceFollowIndex=-1;showAns=false;renderPractice()}function setPracticeStatus(st){let q=practicePool[practiceIndex],orig=db.questions.find(x=>x.id===q.id);if(orig)orig.status=st;save();q.status=st;renderPractice()}
const dayFields=[['date','면접일'],['time','시간'],['place','장소'],['format','면접 방식'],['duration','면접 시간'],['items','준비물'],['motivation','지원동기 핵심'],['last','마지막 한마디'],['keywords','꼭 기억할 키워드'],['memo','기타 메모']];function renderDay(){let d=active().day||{};view.innerHTML=`<div class="topline"><div><h2>📌 면접 당일 한 장</h2><div class="small">당일에는 이 화면만 빠르게 확인할 수 있게 핵심만 정리해요.</div></div></div><div class="daygrid">${dayFields.map(([k,l])=>`<div class="daybox"><label>${l}</label>${['motivation','last','keywords','memo','items'].includes(k)?`<textarea oninput="saveDay('${k}',this.value)" placeholder="입력하세요">${esc(d[k]||'')}</textarea>`:`<input value="${esc(d[k]||'')}" oninput="saveDay('${k}',this.value)" placeholder="입력하세요">`}</div>`).join('')}</div>`}function saveDay(k,v){active().day[k]=v;save()}
function exportPDF(){let a=active();if(!a)return alert('먼저 학교를 선택해주세요.');let research=sections.map(([n])=>{let d=a.data?.[n]||{};return `<section><h2>${esc(n)} ${d.done?'✓':''}</h2><div>${d.text||d.html||'<span class=muted>작성된 내용 없음</span>'}</div>${(d.images||[]).map(x=>`<img src="${x}">`).join('')}</section>`}).join('');let qs=allQuestions().filter(q=>!(q.schoolIds||[]).length||(q.schoolIds||[]).map(String).includes(String(a.id))).map(q=>`<section><h2>${q.star?'⭐ ':''}${esc(q.text)}</h2><div>${esc(q.answer||'')}</div><div class=muted>${esc(q.keywords||'')}</div></section>`).join('');let acts=(a.activities||[]).map(x=>`<section><h2>${esc(x.title)}</h2><div>${esc(x.body)}</div><div><b>학교 연결:</b> ${esc(x.link)}</div></section>`).join('');let day=dayFields.map(([k,l])=>a.day?.[k]?`<div><b>${l}</b> · ${esc(a.day[k])}</div>`:'').join('');let w=window.open('','_blank');w.document.write(`<!doctype html><html lang=ko><head><meta charset=utf-8><title>${esc(a.name)} 면접 준비</title><style>@page{size:A4;margin:15mm}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#172033;line-height:1.6}h1{margin-bottom:0}.sub,.muted{color:#667085}section{break-inside:avoid;border-top:1px solid #ddd;padding:12px 0}h2{font-size:16px}img{max-width:180px;max-height:130px;object-fit:contain;margin:5px}</style></head><body><h1>${esc(a.name)}</h1><div class=sub>${esc(a.major||'')} · 면접 준비 자료</div><h2>📌 면접 당일</h2>${day}<h2>📚 학교 조사</h2>${research}<h2>🔗 학생부 연결</h2>${acts}<h2>💬 예상 질문</h2>${qs}<script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`);w.document.close()}
schoolMajor.addEventListener('keydown',e=>{if(e.key==='Enter')createSchool()});schoolName.addEventListener('keydown',e=>{if(e.key==='Enter')schoolMajor.focus()});render();
